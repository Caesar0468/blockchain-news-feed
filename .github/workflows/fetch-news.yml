name: Fetch and Aggregate News

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # allows manual run from GitHub UI

permissions:
  contents: write             # allow the bot to commit changes

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install rss-parser

      - name: Run aggregation script
        run: node scripts/fetch-news.js

      - name: Commit and push updated news.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update aggregated news data"
          git push
