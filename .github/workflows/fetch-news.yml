name: Fetch and Aggregate News

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-fetch
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run aggregation script
        run: npm run fetch

      - name: Check if news.json changed
        id: check_changes
        run: |
          git add data/news.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit news.json
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update aggregated news data"
          echo "NEWS_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create latest.json pointer
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          mkdir -p data
          printf '{"sha":"%s"}\n' "$NEWS_SHA" > data/latest.json
          git add data/latest.json
          git commit -m "chore: update latest news pointer"

      - name: Push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: git push